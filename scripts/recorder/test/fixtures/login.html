<!doctype html>
<html>
<head><meta charset="utf-8"><title>Stub login</title></head>
<!-- HZ-665: like Horizon's UI, nothing renders until /api/auth/me answers.
     A 401 draws the login page's Sign in button 800 ms after that (so after
     load); a 200 draws the .app shell. -->
<body style="margin:0;width:1280px;height:720px;background:#f4f5f7;font-family:sans-serif">
  <div id="root"></div>
  <script>
    fetch('/api/auth/me').then((res) => {
      setTimeout(() => {
        const root = document.getElementById('root')
        if (res.ok) {
          root.className = 'app'
          root.textContent = 'Board'
        } else {
          const button = document.createElement('button')
          button.textContent = 'Sign in'
          root.appendChild(button)
        }
      }, res.ok ? 0 : 800)
    })
  </script>
</body>
</html>
