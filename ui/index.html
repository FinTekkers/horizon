<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Horizon · Delivery Lifecycle</title>
    <script>
      // Applied synchronously, before first paint, so a dark-mode choice
      // never flashes light on load. Kept a plain inline script (not a
      // ui/src/theme.js import) since module scripts run after parsing.
      (function () {
        try {
          if (localStorage.getItem('horizon_theme') === 'dark') {
            document.documentElement.dataset.theme = 'dark'
          }
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
