# shoreward.ai — Shoreward landing at /, Horizon at /horizon (app-level login,
# HZ-21: a session cookie, not HTTP Basic Auth — the app itself owns the gate
# so its own login page can be served without a second credential prompt).
# Installed at /etc/nginx/sites-available/shoreward (symlinked into
# sites-enabled). certbot --nginx rewrites this for TLS after DNS cutover.

server {
    # default_server so the site also answers on the bare elastic IP
    # (useful before/without DNS).
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name shoreward.ai www.shoreward.ai;

    root /opt/shoreward/dist;
    index index.html;

    # ---- Shoreward static site ----
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Contact form → local nodemailer shim (shoreward-contact.service)
    location = /api/contact {
        proxy_pass http://127.0.0.1:3002/api/contact;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- Horizon (built with HORIZON_BASE=/horizon/) ----
    location = /horizon { return 301 /horizon/; }

    location /horizon/ {
        alias /opt/horizon/ui/dist/;
        # Deep links (/horizon/hz-7, /horizon/admin) fall back to the app shell,
        # which renders its own login page when there's no session (HZ-21).
        try_files $uri $uri/ /horizon/index.html;
    }

    # GitHub webhook: HMAC-verified by the app itself, so no basic auth —
    # GitHub can't send credentials. Must come before the generic api block.
    location = /horizon/api/webhooks/github {
        proxy_pass http://127.0.0.1:3001/api/webhooks/github;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /horizon/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE (/api/stream): no buffering, long read timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
