# Root-level pytest marker so the farm's guardrail runner (farm/checks.py,
# which detects checks at the repo root only) discovers and runs the Python
# suite. `python -m pytest -q` from the root now runs farm/tests.
[pytest]
testpaths = farm/tests
# HZ-238: keep tmp_path dirs only for failed tests, and only the latest run's.
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
